services:
  backend:
    build: ./backend
    env_file:
      - ./.env
    ports:
      - "80:8080"
    depends_on:
      postgres:
          condition: "service_healthy"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  
  postgres:
    image: postgres:18 
    env_file:
      - ./.env
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
    
volumes:
  postgres_data:
