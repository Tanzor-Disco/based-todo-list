   name: Bad CI

   on:
     push:
       branches:
         - lab3

   permissions:
     contents: read
     packages: write

   jobs:
     build:
       name: Build and publish Docker image
       runs-on: ubuntu-24.04

       steps:
         - name: Checkout repository
           uses: actions/checkout@main

         - name: Prepare image name
           run: |
             echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-bad:latest" >> "$GITHUB_ENV"

         - name: Build image
           run: |
             docker build \
               -f backend/Dockerfile.bad \
               -t "$IMAGE" \
               ./backend

         - name: Show image
           run: docker image ls "$IMAGE"

         - name: Login to GHCR
           env:
             GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           run: |
             echo "$GHCR_TOKEN" | docker login ghcr.io \
               --username "$GITHUB_ACTOR" \
               --password-stdin

         - name: Push image
           run: docker push "$IMAGE"

     deploy:
       name: Deploy on local machine
       needs: build
       runs-on: [self-hosted, linux, x64, todo-deploy]

       permissions:
         contents: read
         packages: read

       env:
         DOCKER_CONFIG: ${{ runner.temp }}/docker-config-bad

       steps:
         - name: Checkout repository
           uses: actions/checkout@main

         - name: Prepare image name
           run: |
             echo "APP_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-bad:latest" >> "$GITHUB_ENV"

         - name: Login to GHCR
           env:
             GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           run: |
             mkdir -p "$DOCKER_CONFIG"
             echo "$GHCR_TOKEN" | docker login ghcr.io \
               --username "$GITHUB_ACTOR" \
               --password-stdin

         - name: Pull images
           run: |
             docker compose \
               --env-file "$HOME/todo-deploy/.env" \
               -p todo-lab3-bad \
               -f compose.deploy.bad.yaml \
               pull

         - name: Start application
           run: |
             docker compose \
               --env-file "$HOME/todo-deploy/.env" \
               -p todo-lab3-bad \
               -f compose.deploy.bad.yaml \
               up -d

         - name: Show containers
           run: |
             docker compose \
               --env-file "$HOME/todo-deploy/.env" \
               -p todo-lab3-bad \
               -f compose.deploy.bad.yaml \
               ps
